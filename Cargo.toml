[package]
name = "mapskit"
version = "26.1.0"
edition = "2021"
license = "TCL"
description = "Maps framework for TontooOS - Apple MapsKit-style map views, places, routing and a 3D globe"
readme = "README.md"
keywords = ["tontoo", "maps", "osm", "gtk4", "globe"]
categories = ["gui", "api-bindings"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gdk-pixbuf = "0.20"
glib = "0.20"
gio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
networkkit = { path = "../NetworkKit" }
url = "2"
async-channel = "2"
glow = "0.16"
libloading = "0.8"
uikit = { path = "../UIKit" }
corelocation = { path = "../CoreLocation" }

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "maps_demo"
path = "examples/maps_demo.rs"

[[example]]
name = "places_search"
path = "examples/places_search.rs"
