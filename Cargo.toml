[package]
name = "mapskit"
version = "27.0.0"
edition = "2021"
license = "TCL"
description = "Maps framework for TontooOS - Apple MapsKit-style map views, places, routing and a 3D globe"
readme = "README.md"
keywords = ["tontoo", "maps", "osm", "tontooui", "globe"]
categories = ["gui", "api-bindings"]

[dependencies]
foundation = { path = "../Foundation" }
networkkit = { path = "../NetworkKit" }
tontooui = { path = "../TontooUI" }
corelocation = { path = "../CoreLocation" }
vello = "0.10"
parley = "0.11"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
corelocation = { path = "../CoreLocation" }

[[example]]
name = "maps_demo"
path = "examples/maps_demo.rs"

[[example]]
name = "places_search"
path = "examples/places_search.rs"

[[example]]
name = "globe_demo"
path = "examples/globe_demo.rs"
